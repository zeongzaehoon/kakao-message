[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kakao-friend-sender"
version = "0.1.1"
description = "Local desktop tool for selecting KakaoTalk conversations and sending messages"
requires-python = ">=3.11"
dependencies = [
  "PySide6-Essentials>=6.7,<7",
  "pywinauto>=0.6.8,<0.7; sys_platform == 'win32'",
  "psutil>=5.9,<8; sys_platform == 'win32'",
  "pyobjc-framework-ApplicationServices>=10,<13; sys_platform == 'darwin'",
  "pyobjc-framework-Cocoa>=10,<13; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6,<7"]

[project.scripts]
kakao-friend-sender = "kakaosender.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
